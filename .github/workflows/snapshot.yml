# Keeps data/jobs.json in step with the live board so matches survive
# Render's free-tier restarts (the app reloads this file on startup).
# Needs no secrets: /api/jobs is public and GITHUB_TOKEN can commit.
name: Job snapshot

on:
  schedule:
    - cron: "45 14,17,20,23,2 * * *"   # 10:45 AM, 1:45, 4:45, 7:45, 10:45 PM Eastern (EDT)
  workflow_dispatch:
    inputs:
      scan:
        description: "Run a full job scan first"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: job-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The daily scan. Render's free tier has no cron, and the outside scheduler stopped
      # calling /api/scan after Oct 26, so every job aged out by Nov 9. With a CRON_TOKEN
      # repository secret (the same value as the CRON_TOKEN set on Render), this job runs
      # the scan itself on the first run of each day (10:45 AM Eastern) and on demand.
      - name: Run the daily scan
        env:
          CRON_TOKEN: ${{ secrets.CRON_TOKEN }}
        run: |
          hour=$(date -u +%H)
          if [ "$hour" != "14" ] && [ "$hour" != "15" ] && [ "${{ inputs.scan }}" != "true" ]; then
            echo "Not the daily scan slot; snapshot only."; exit 0
          fi
          if [ -z "$CRON_TOKEN" ]; then
            # Red once a day (the scan slot only), so the HQ watchdog flags it without five failures a day.
            echo "::error::No CRON_TOKEN secret, so the daily job scan can't run. Add it under Settings, Secrets and variables, Actions."
            exit 1
          fi
          for i in 1 2 3 4; do
            code=$(curl -s -o scan.json -w '%{http_code}' --max-time 300 -X POST "https://creation-lc6a.onrender.com/api/scan?wait=true&token=$CRON_TOKEN") || code=000
            echo "attempt $i: HTTP $code"; cat scan.json 2>/dev/null; echo
            if [ "$code" = "200" ]; then
              kept=$(python -c "import json;print(json.load(open('scan.json')).get('kept',0))" 2>/dev/null || echo 0)
              if [ "$kept" = "0" ]; then
                echo "::error::The scan ran but kept 0 jobs. Check the board's /health page: a job source key may be missing or rejected."
                exit 1
              fi
              echo "Scan kept $kept jobs."; exit 0
            fi
            [ "$code" = "401" ] && { echo "::error::Render rejected the CRON_TOKEN secret; it must match the one set on Render."; exit 1; }
            sleep 30
          done
          echo "::error::The scan did not complete"; exit 1
      - name: Pull the live board (wakes a sleeping instance)
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS --max-time 90 "https://creation-lc6a.onrender.com/api/jobs?limit=1000" -o live.json; then
              python -c "import json;json.load(open('live.json'))" && break
            fi
            echo "attempt $i failed; retrying in 20s"; sleep 20
          done
          test -s live.json
      - name: Merge into data/jobs.json
        run: python snapshot.py live.json data/jobs.json
      - name: Commit if changed
        run: |
          if git diff --quiet -- data/jobs.json; then echo "no change"; exit 0; fi
          git config user.name "job-snapshot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jobs.json
          git commit -m "Update job snapshot [skip render]"
          git push
