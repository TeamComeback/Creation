# Refreshes the Team Comeback HQ's numbers without needing a Claude session.
# Runs hq/collector.py and publishes snapshot.json, findings.json and
# shipping.json to the hq-data branch (never main, so Render does not redeploy).
# The HQ upkeep run reads those files about 40 minutes later.
name: HQ data

on:
  schedule:
    - cron: "50 12,17,23 * * *"   # 7:50 AM, 12:50 PM, 6:50 PM Eastern (EST)
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: hq-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/out
          python -I hq/collector.py /tmp/out
          python -c "import json;s=json.load(open('/tmp/out/snapshot.json'));json.load(open('/tmp/out/findings.json'));assert len(s['businesses'])>=5"
      - name: Publish to the hq-data branch
        run: |
          git config user.name "hq-data"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin hq-data
          git worktree add /tmp/data origin/hq-data
          cd /tmp/data
          git checkout -B hq-data origin/hq-data
          cp /tmp/out/snapshot.json /tmp/out/findings.json /tmp/out/shipping.json .
          git add -A
          git commit -q -m "data: $(date -u +%Y-%m-%dT%H:%MZ)" || { echo "no change"; exit 0; }
          git push origin hq-data
