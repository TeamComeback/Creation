# Refreshes the Team Comeback HQ's numbers without needing a Claude session.
# Runs hq/collector.py and publishes snapshot.json, findings.json and
# shipping.json to the hq-data branch (never main, so Render does not redeploy).
# The HQ upkeep and shipping runs also start it by hand (workflow_dispatch) whenever the data is stale.
name: HQ data

on:
  schedule:
    - cron: "17 */2 * * *"     # every 2 hours at :17. GitHub drops or delays many scheduled runs in this repo
    - cron: "47 1-23/2 * * *"  # second line, offset by an hour: if GitHub drops one slot, the other still fires
                                #   (about 2 of 5 fire), so frequent slots keep the data under ~4 hours old.
    # Owner-approved Nov 22 2026: three more lines about 55 minutes before each upkeep run (8:33 AM, 1:33 PM,
    # 7:33 PM Eastern, which is 13:33, 18:33 and 00:33 UTC in winter), because GitHub started none of the
    # slots above in the hours just before upkeep on several days. After the March 8 2027 clock change
    # the upkeep slots move an hour earlier in UTC: change 12,17,23 to 11,16,22 then.
    - cron: "37 12,17,23 * * *"
    # Nov 23 2026: the 12:37 UTC slot was dropped again (no run between 2:40 AM and 9:00 AM Eastern), so the
    # morning upkeep run read stale data. One extra morning line (7:07 AM Eastern); shift to 11 after Mar 8 2027.
    - cron: "7 12 * * *"
    # Nov 24 2026: GitHub started none of the 12:07, 12:37 or :17/:47 slots between 04:49 and 14:07 UTC. One more
    # early slot (6:37 AM Eastern); shift to 10 after Mar 8 2027.
    - cron: "37 11 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: hq-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/out
          python -I hq/collector.py /tmp/out
          python -c "import json;s=json.load(open('/tmp/out/snapshot.json'));json.load(open('/tmp/out/findings.json'));assert len(s['businesses'])>=5"
      - name: Publish to the hq-data branch
        run: |
          git config user.name "hq-data"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin hq-data
          git worktree add /tmp/data origin/hq-data
          cd /tmp/data
          git checkout -B hq-data origin/hq-data
          cp /tmp/out/snapshot.json /tmp/out/findings.json /tmp/out/shipping.json .
          git add -A
          git commit -q -m "data: $(date -u +%Y-%m-%dT%H:%MZ)" || { echo "no change"; exit 0; }
          git push origin hq-data
